# ---------------------------------------------------------------------------
# `uid` is the ONLY identity that matters. It is human-readable, immutable, and
# is hashed (uuidv5) into the Kibana rule_id. Rename the file freely; never
# rename the uid unless you intend to destroy and recreate the rule.
# ---------------------------------------------------------------------------
uid: win-svc-account-interactive-login

name: "Service Account Interactive Login"
description: |
  Detects interactive logins by service accounts. Service accounts should
  authenticate via service (Type 5) or batch (Type 4) logon types, not
  interactively. Interactive logins by service accounts may indicate
  credential theft or misuse.

type: esql
language: esql
query: |
  FROM logs-system.security-* metadata _id, _version, _index
  | WHERE event.code == "4624"
    AND (user.name LIKE "svc_*" OR user.name LIKE "svc-*"
         OR user.name LIKE "*_svc" OR user.name LIKE "*$")
    AND winlog.logon.type IN ("Interactive", "RemoteInteractive",
        "CachedInteractive", "CachedRemoteInteractive")
  | KEEP @timestamp, host.name, user.name, user.domain, winlog.logon.type, source.ip, _id, _version, _index

severity: high
risk_score: 73

tags:
  - "Domain: Endpoint"
  - "OS: Windows"
  - "Use Case: Identity and Access Audit"
  - "Tactic: Initial Access"
  - "Data Source: Windows Security Event Log"

false_positives:
  - "Service accounts with documented exceptions that require interactive logon"
  - "Break-glass procedures during incident response"

references:
  - "https://learn.microsoft.com/en-us/entra/architecture/service-accounts-on-premises"
  - "https://attack.mitre.org/techniques/T1078/002/"

threat:
  - framework: "MITRE ATT&CK"
    tactic:
      id: "TA0001"
      name: "Initial Access"
      reference: "https://attack.mitre.org/tactics/TA0001/"
    technique:
      - id: "T1078"
        name: "Valid Accounts"
        reference: "https://attack.mitre.org/techniques/T1078/"
        subtechnique:
          - id: "T1078.002"
            name: "Domain Accounts"
            reference: "https://attack.mitre.org/techniques/T1078/002/"

# Logical exception-list uids from exceptions/*.yaml - resolved by the module.
exceptions:
  - svc-account-interactive-login

# Logical connector names, mapped to real connector IDs per cluster in tfvars.
actions:
  - connector: soc_pagerduty
    group: default
    params:
      summary: "{{context.rule.name}} on {{context.alerts.0.host.name}}"
